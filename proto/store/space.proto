syntax = "proto3";

package memos.store;

option go_package = "gen/store";

// SpacePayload stores optional Space display metadata.
message SpacePayload {
  Icon icon = 1;

  // If true, this Space is permanently excluded from every all-scope memo
  // collection (Home, Calendar, Map, Explore) and cannot receive invitations.
  // Fixed at creation; never toggled on an existing Space.
  bool exclude_from_timeline = 2;

  // Parent actual Space UID for a private per-member Scratchpad Space.
  string parent_space_uid = 3;

  message Icon {
    oneof value {
      // A Unicode emoji sequence.
      string emoji = 1;
      // A canonical Lucide icon name, such as "leaf".
      string lucide = 2;
    }
  }
}
